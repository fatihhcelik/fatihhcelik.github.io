- cve: "CVE-2024-25712"
  product: "swaggo"
  type: "Unrestricted File Upload"
  severity: "high"
  description: "In versions of the swaggo/http-swagger library below v1.2.5, proper HTTP method validation is not enforced. As a result, the handler 'httpSwagger.WrapHandler' and the 'PUT' request can be used to upload a file to memory through *webdav.memFile. Subsequently, this file can be accessed using the GET method. An attacker could exploit this by uploading an HTML file containing malicious JavaScript to memory, making it accessible to other users."

- cve: "CVE-2023-42282"
  product: "ip.isPublic"
  type: "SSRF"
  severity: "medium"
  description: "In the code snippet of library, a security vulnerability arises due to the ip.isPublic function's incorrect identification of the IP address 0x7f.1 as public. This address is actually a hexadecimal representation of the private IP 127.0.0.1. This misclassification can lead to potential Server-Side Request Forgery (SSRF) attacks, as the code may unintentionally permit HTTP requests to internal network resources, creating a significant security risk. The core issue is the function's failure to accurately distinguish between public and private IP addresses."
  post_link: "/posts/Missing-IP-Address-Control-in-isPublic()-Function-Leads-to-SSRF-Bypass-PoC/"

